<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Choose Season, decades, classic</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Righteous&amp;family=PT+Sans:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;margin:0;padding:0;border:0;background:none;cursor:pointer;text-align:center}
button:disabled{cursor:default}
a{color:#f5e000}a:hover{color:#fff}
</style>
</helmet>
<div style="width: 800px; height: 600px; position: relative; overflow: hidden; font-family: 'PT Sans', Tahoma, sans-serif; color: #ffffff; background: radial-gradient(ellipse at 70% 30%, #2b3550 0%, #121828 55%, #070a12 100%)">
  <div aria-hidden="true" style="position: absolute; inset: 0; opacity: 0.10; background: repeating-linear-gradient(45deg, #ffffff 0 1px, transparent 1px 22px), repeating-linear-gradient(-45deg, #ffffff 0 1px, transparent 1px 22px)"></div>

  <div style="position: absolute; left: 0; top: 0; width: 90px; height: 600px; background: linear-gradient(180deg, #0c1aa8, #050c5c); display: flex; flex-direction: column; gap: 4px; padding: 6px 4px; box-sizing: border-box">
    <div style="border: 1px solid #3a4ad8; padding: 6px 2px; text-align: center; font-size: 12px; font-weight: 700; color: #f5e000; line-height: 1.25">Version<br>3.9.68</div>
    <div style="border: 1px solid #3a4ad8; height: 40px; display: flex; align-items: center; justify-content: space-around; color: #f5e000; font-size: 16px">&#8592; &#8594;</div>
    <div style="border: 1px solid #3a4ad8; padding: 8px 2px; text-align: center; font-size: 12px; font-weight: 700; color: #f5e000; line-height: 1.25">Restart<br>Game</div>
    <div style="border: 1px solid #3a4ad8; padding: 8px 2px; text-align: center; font-size: 12px; font-weight: 700; color: #f5e000; line-height: 1.25">Exit<br>Game</div>
  </div>

  <div style="position: absolute; left: 100px; top: 8px; width: 690px; height: 48px; background: linear-gradient(180deg, #ff1a1a, #c80000); border: 1px solid #ff6a6a; display: flex; align-items: center; justify-content: center">
    <h1 style="margin: 0; font-family: Righteous, 'PT Sans', sans-serif; font-weight: 400; font-size: 28px; letter-spacing: 0.5px; color: #ffffff; text-shadow: 0 2px 0 #7a0000">Choose Season</h1>
  </div>

  <div style="position: absolute; left: 100px; top: 66px; width: 690px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="{{row.headStyle}}">
          <span style="font-weight: 700; font-size: 13px; color: #ffffff">{{row.name}}</span>
          <span style="font-size: 10px; color: #e6e9ff">{{row.range}}</span>
        </div>
        <div style="display: flex; gap: 5px">
          <sc-for list="{{row.cells}}" as="t" hint-placeholder-count="10">
            <sc-if value="{{t.empty}}" hint-placeholder-val="{{false}}">
              <div style="{{t.style}}"></div>
            </sc-if>
            <sc-if value="{{t.tile}}" hint-placeholder-val="{{true}}">
              <button type="button" onClick="{{t.pick}}" disabled="{{t.off}}" aria-pressed="{{t.sel}}" aria-label="{{t.aria}}" style="{{t.style}}">
                <span style="{{t.yearStyle}}">{{t.label}}</span>
                <span style="{{t.tagStyle}}">{{t.tag}}</span>
                <sc-if value="{{t.star}}" hint-placeholder-val="{{false}}">
                  <svg aria-hidden="true" width="9" height="9" viewBox="0 0 24 24" style="position: absolute; top: 3px; right: 3px"><path d="M12 2l3 7h7l-5.5 4.5L18.5 21 12 16.8 5.5 21l2-7.5L2 9h7z" fill="#f5e000"></path></svg>
                </sc-if>
              </button>
            </sc-if>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 100px; top: 352px; width: 690px; height: 166px; box-sizing: border-box; background: rgba(6,10,40,0.82); border: 1px solid #3a4ad8; border-top: 3px solid {{eraColour}}; padding: 12px 16px; display: flex; gap: 20px">
    <div style="width: 130px; display: flex; flex-direction: column; gap: 3px">
      <span style="font-family: Righteous, sans-serif; font-size: 32px; color: #f5e000; line-height: 1">{{selLabel}}</span>
      <span style="font-size: 12px; font-weight: 700; color: {{eraColourText}}">{{eraName}}</span>
      <span style="font-size: 12px; color: #d6dcff; margin-top: 10px">Starts July {{startYear}}</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
      <span style="font-size: 18px; font-weight: 700; color: #ffffff">{{dbName}}</span>
      <span style="font-size: 11px; color: #d6dcff">{{credit}}</span>
      <div style="display: flex; gap: 6px; align-items: baseline">
        <span style="font-size: 11px; color: #d6dcff; width: 52px; flex-shrink: 0">Europe:</span>
        <span style="font-size: 12px; color: #ffffff">{{europe}}</span>
      </div>
      <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap">
        <span style="font-size: 11px; color: #d6dcff; width: 52px">{{versionLabel}}</span>
        <sc-for list="{{versions}}" as="v" hint-placeholder-count="2">
          <button type="button" onClick="{{v.pick}}" aria-pressed="{{v.sel}}" style="{{v.style}}">{{v.name}}</button>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 100px; top: 524px; width: 690px; height: 26px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 11px; color: #d6dcff">More versions of each season are on the Update Team's forum.</span>
    <a href="https://champman0102.co.uk/" style="font-size: 11px; font-weight: 700; text-decoration: none; border: 1px solid #8a8aa0; padding: 4px 10px; background: linear-gradient(180deg, #9a9aa6, #6e6e7a); color: #ffffff">Open champman0102.co.uk</a>
  </div>

  <div style="position: absolute; left: 100px; top: 558px; width: 690px; height: 36px; display: flex; gap: 4px">
    <button type="button" style="flex-grow: 1; background: linear-gradient(180deg, #9a9aa6, #6e6e7a); border: 1px solid #b8b8c4; color: #ffffff; font-size: 17px; font-weight: 700">Back</button>
    <button type="button" style="width: 230px; background: linear-gradient(180deg, #ffe94a, #d9b800); border: 1px solid #fff2a0; color: #1a1400; font-size: 17px; font-weight: 700">{{startText}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":600}}'>
const DECADES = [
  { name: '2000s', range: '2001/02 to 2009/10', c: '#e08a00', t: '#ffb84a', from: 2000 },
  { name: '2010s', range: '2010/11 to 2019/20', c: '#2c9a44', t: '#6fd88a', from: 2010 },
  { name: '2020s', range: '2020/21 to 2025/26', c: '#2f62e0', t: '#8eaaff', from: 2020 }
];
const DB = { 2001: '3.9.68', 2002: '3.9.68', 2003: 'October 2003', 2004: null, 2005: 'September 2005', 2006: null, 2007: 'November 2007', 2008: 'September 2008', 2009: 'September 2009', 2010: 'September 2010 ODB', 2011: 'September 2011 ODB', 2012: 'September 2012', 2013: 'Autumn 2013', 2014: 'October 2014', 2015: 'October 2015', 2016: 'October 2016', 2017: 'October 2017', 2018: 'October 2018', 2019: 'October 2019', 2020: 'November 2020', 2021: 'October 2021', 2022: 'October 2022', 2023: 'October 2023', 2024: 'October 2024', 2025: 'December 2025' };
const VERSIONS = { 2001: ['3.9.68', '3.9.60', '3.9.65'], 2010: ['September 2010 ODB', 'December 2010 SIM'] };
const INSTALLED = { 2010: true, 2024: true };
const STAR = { 2001: true, 2010: true };
const LAYOUT = { tileW: 64, gap: 5, tileH: 60, yearSize: 13, tagSize: 9, tagPad: '2px 4px', headH: 20, starPad: 15 };
function decadeOf(y) { return DECADES[y < 2010 ? 0 : y < 2020 ? 1 : 2]; }
function label(y) { return y + '/' + String(y + 1).slice(2); }
function europe(y) {
  if (y <= 2002) return 'Champions League with two group stages, UEFA Cup, Intertoto Cup';
  if (y === 2003) return 'Champions League, UEFA Cup, Intertoto Cup';
  if (y <= 2008) return 'Champions League, UEFA Cup with groups, Intertoto Cup';
  if (y <= 2020) return 'Champions League, Europa League';
  if (y <= 2023) return 'Champions League, Europa League, Conference League';
  return 'Champions League, Europa League, Conference League, each with a 36-club league phase';
}
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: 2010, ver: 0 }; }
  cell(y, d, L, span) {
    const custom = y === 'custom';
    const sel = this.state.sel === y;
    const none = !custom && !DB[y];
    let tag, tagBg, tagFg;
    if (custom) { tag = '1 folder'; tagBg = 'rgba(255,255,255,0.16)'; tagFg = '#e6e9ff'; }
    else if (none) { tag = 'No database'; tagBg = 'transparent'; tagFg = '#9a9aab'; }
    else if (y <= 2002) { tag = 'Official'; tagBg = '#d9a800'; tagFg = '#1a1200'; }
    else if (INSTALLED[y]) { tag = 'Installed'; tagBg = '#2a9a44'; tagFg = '#ffffff'; }
    else { tag = 'Included'; tagBg = 'rgba(255,255,255,0.16)'; tagFg = '#e6e9ff'; }
    const w = span ? L.tileW * span + L.gap * (span - 1) : L.tileW;
    const top = none ? '#55556a' : custom ? '#8a8aa0' : d.c;
    const bg = none ? 'rgba(40,40,52,0.72)' : custom ? 'linear-gradient(180deg, #5a5a7288 0%, rgba(30,30,50,0.94) 70%)' : 'linear-gradient(180deg, ' + d.c + '66 0%, rgba(14,18,66,0.94) 70%)';
    return {
      tile: true, empty: false,
      label: custom ? 'Custom database' : label(y), tag, sel, off: none, star: !!STAR[y],
      aria: (custom ? 'Custom database' : label(y)) + ', ' + tag,
      pick: () => { if (!none) this.setState({ sel: y, ver: 0 }); },
      style: 'position: relative; flex-shrink: 0; width: ' + w + 'px; height: ' + L.tileH + 'px; box-sizing: border-box; padding-top: ' + L.starPad + 'px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: ' + Math.round(L.tileH / 9) + 'px; background: ' + bg + '; border: 1px solid ' + (sel ? '#f5e000' : 'rgba(255,255,255,0.22)') + '; border-top: 3px solid ' + (sel ? '#f5e000' : top) + '; box-shadow: ' + (sel ? '0 0 0 1px #f5e000, 0 0 10px rgba(245,224,0,0.45)' : 'none'),
      yearStyle: 'font-weight: 700; font-size: ' + L.yearSize + 'px; line-height: 1; white-space: nowrap; color: ' + (none ? '#8a8a9c' : sel ? '#f5e000' : '#ffffff'),
      tagStyle: 'font-size: ' + L.tagSize + 'px; font-weight: 700; line-height: 1; white-space: nowrap; padding: ' + L.tagPad + '; background: ' + tagBg + '; color: ' + tagFg
    };
  }
  renderVals() {
    const L = LAYOUT;
    const rows = DECADES.map((d) => {
      const cells = [];
      for (let k = 0; k < 10; k++) {
        const y = d.from + k;
        if (y < 2001) cells.push({ tile: false, empty: true, style: 'flex-shrink: 0; width: ' + L.tileW + 'px; height: ' + L.tileH + 'px' });
        else if (y <= 2025) cells.push(this.cell(y, d, L, 0));
      }
      if (d.from === 2020) cells.push(this.cell('custom', d, L, 4));
      return {
        name: d.name, range: d.range, cells,
        headStyle: 'height: ' + L.headH + 'px; display: flex; gap: 8px; align-items: center; padding: 0 8px; background: linear-gradient(90deg, ' + d.c + ', transparent 85%)'
      };
    });
    const s = this.state.sel;
    const custom = s === 'custom';
    const d = custom ? null : decadeOf(s);
    const vers = custom ? ['My edited data'] : (VERSIONS[s] || [DB[s]]);
    const ver = Math.min(this.state.ver, vers.length - 1);
    return {
      rows,
      selLabel: custom ? 'Custom' : label(s),
      eraName: custom ? 'Season: 2025/26' : d.name,
      eraColour: custom ? '#8a8aa0' : d.c,
      eraColourText: custom ? '#d6dcff' : d.t,
      startYear: custom ? 2025 : s,
      dbName: custom ? 'My edited data' : (s <= 2002 ? 'Official data ' + vers[ver] : vers[ver]),
      credit: custom ? 'A folder in Databases. You name its season.' : (s <= 2002 ? 'Data by Sports Interactive' : 'Database by the CM 01/02 Update Team'),
      europe: europe(custom ? 2025 : s),
      versionLabel: vers.length > 1 ? 'Version:' : '',
      versions: vers.length > 1 ? vers.map((n, i) => ({
        name: n, sel: i === ver,
        pick: () => this.setState({ ver: i }),
        style: 'font-size: 11px; font-weight: 700; padding: 5px 10px; background: ' + (i === ver ? 'rgba(245,224,0,0.12)' : 'linear-gradient(180deg, #9a9aa6, #6e6e7a)') + '; border: 1px solid ' + (i === ver ? '#f5e000' : '#b8b8c4') + '; color: ' + (i === ver ? '#f5e000' : '#ffffff')
      })) : [],
      startText: 'Start ' + (custom ? '2025/26' : label(s))
    };
  }
}
</script>
</body>
</html>
